[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sound-razor"
version = "0.1.0"
description = "Local audio stem separation, music metadata lookup, and YouTube import"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
separation = ["audio-separator[cpu]>=0.30,<0.45"]
guitars = ["torch>=2.8", "numpy>=2,<3", "soundfile", "librosa>=0.11", "einops>=0.8", "beartype", "rotary-embedding-torch>=0.6.5,<0.7", "packaging"]
youtube = ["yt-dlp[default]>=2025.1"]

[project.scripts]
sound-razor = "sound_razor.cli:main"

[tool.setuptools.packages.find]
include = ["sound_razor*"]

[tool.setuptools.package-data]
sound_razor = ["web/*.html", "web/*.css", "web/*.js", "web/vendor/soundtouch/*"]
"sound_razor.vendor.roformer" = ["*.json", "LICENSE", "NOTICE.md"]
