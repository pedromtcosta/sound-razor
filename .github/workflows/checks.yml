name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  install-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install uv==0.12.21
      - name: Install all extras in a fresh environment
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python --torch-backend cpu -e '.[separation,guitars,youtube]'
          uv pip check --python .venv/bin/python
      - name: Run regression tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Check browser JavaScript
        run: |
          node --input-type=module --check < sound_razor/web/app.js
          node --input-type=module --check < sound_razor/web/player.js
          node --input-type=module --check < sound_razor/web/tempo-worklet.js
      - name: Test playback timing and pitch preservation
        run: node --test tests/test_player.mjs
